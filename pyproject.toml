[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.2.0"
description = "Reproducible funded option hedging and controlled policy evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gymnasium>=0.29,<1.1",
    "numpy>=1.26,<2.0",
    "pyyaml>=6.0,<7.0",
    "scipy>=1.11,<1.15",
    "stable-baselines3>=2.3,<3.0",
    "torch>=2.2,<3.0",
]

[project.scripts]
quantlab-train = "quantlab.rl.train:main"
quantlab-evaluate = "quantlab.rl.evaluate:main"
quantlab-experiment = "quantlab.rl.experiment:main"
quantlab-report = "quantlab.rl.report:main"
quantlab-benchmark = "quantlab.backtesting.benchmark:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

report = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
